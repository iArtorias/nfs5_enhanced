; NFS5 Enhanced configuration.
; Booleans accept '1', '0', 'true', 'false', 'on', 'off', 'yes', 'no'.

[General]
; '0' trace, '1' info, '2' warnings, '3' errors, '4' no log file.
LogLevel = 1
; When 'SilentPatchNFS90s.asi' is also loaded, skip the [Compat] and [Affinity] sections
; so the two never patch the same code. Better to disable that ASI instead.
SkipCompatIfSilentPatchLoaded = 1

[Compat]
; Port of the NFS Porsche fixes from SilentPatchNFS90s.
Enabled = 1
; Let Alt+F4 reach Windows, plain Alt is still swallowed so the menu loop cannot stall the game.
AltF4 = 1
; Do not force Caps Lock, Num Lock and Scroll Lock off at startup.
KeepLockKeys = 1
; Enumerate only attached keyboards and joysticks, fixes the Windows 10 startup crash
; and the very slow controller rebinding screen.
FixDeviceEnumeration = 1
; Release all keys when the window loses focus, no stuck throttle after Alt+Tab.
ClearKeysOnFocusLoss = 1
; Ctrl+V pastes text into name and chat boxes.
ClipboardPaste = 1
; Memory leak fix for Verok OpenGL thrash drivers, does nothing with stock 'dx7z.dll'.
ThrashDriverLeakFix = 1
; 'gimme.dll' reads past its buffer while converting the driver picture after a race,
; which crashes on the way back to the menu. Bad palette counts are rejected.
FixPictureConversion = 1
; The sun glare test reads a few pixels around the sun from the frame without a bounds
; check and crashes when the sun sits at the screen edge. The read is kept on screen.
FixScreenReadback = 1
; Start without the game CD. Also applied when 'SilentPatchNFS90s' is loaded.
SkipCdCheck = 1
; The game loads the graphics driver named in the registry value Thrash Driver. When
; that file is missing, often after another widescreen mod, the game claims DirectX 0
; is installed. This driver from the drivers folder is tried instead, empty disables it.
FallbackDriver = dx7z
; Registry value Thrash Driver as the game sees it. auto keeps the stored driver when it
; loads and otherwise reports dx, the stock 'dx7z.dll'. registry passes the stored value
; unchanged. Any other name, for example dx, is always reported. The registry itself is
; never written by this option. 'dx11' selects the Direct3D 11 driver 'dx11z.dll', the default.
ThrashDriver = dx11

[Affinity]
; '0' off, '1' pin threads created by 'Porsche.exe' to one core, '2' pin the whole process.
Mode = 1
; Logical processor index for game threads, '-1' picks automatically.
; Automatic selection skips core 0 and prefers performance cores on hybrid CPUs.
GameCore = -1
PreferPerformanceCores = 1

[Timing]
; Replace the 'timeSetEvent' based 128 Hz game clock with a QueryPerformanceCounter scheduler.
QpcTimer = 1
; Use 'CREATE_WAITABLE_TIMER_HIGH_RESOLUTION' when available, Windows 10 1803 or newer.
HighResolutionWaitableTimer = 1
; Ticks run back to back after a stall before the schedule is reset, 128 is one second.
MaxCatchUpTicks = 128

[Widescreen]
Enabled = 1
; Hor+ projection for every 3D camera, vertical view matches 4:3, the sides open up.
HorPlus = 1
; Extra field of view scale applied on top of Hor+, 1.0 keeps the original.
FovMultiplier = 1.0
; Keep light flares round on non 4:3 resolutions.
FixSpriteAspect = 1
; Offer every display mode of at least 640x480, the original also filtered by a VRAM estimate.
UnlockResolutions = 1
; Resolution used for races. 'game' (the 'Options -> Graphics' screen size), 'desktop' or WIDTHxHEIGHT.
; The closest mode the graphics driver offers is picked, menus always stay 640x480.
RaceResolution = game
; Distance factor for car detail, distant cars switch to simpler models without wheels.
; The wider Hor+ view is compensated automatically on top, '1' keeps the original distance
; apart from that, '0' leaves the game untouched.
LodDistanceScale = 4.0
; Color depth for races: '0' keeps the game value, '16' or '32'.
RaceColorDepth = 0

[Framerate]
Enabled = 1
; Frame cap while racing, '0' off. Without interpolation the race only draws after a new
; simulation step, so values above 64 have no effect.
FpsLimit = 0
; Frame cap for menus, garage and showroom, '0' off.
FrontendFpsLimit = 0
; Blend car and camera positions between simulation steps so motion is smooth at any
; frame rate. The race loop may then draw more often than the simulation steps, so cap
; the rate with 'FpsLimit' or 'VSync' in DDrawCompat.ini.
Interpolation = 1
; Also blend the chase camera, turn off if the camera looks wrong.
InterpolateCamera = 1
; Changes larger than this many metres in one step are shown at once, resets and cuts.
SnapDistance = 25.0

[IO]
Enabled = 1
; 'ReadFile' chunk for read only files, the engine default is 16 KB.
ReadChunkKB = 1024
; Cache 'GetDiskFreeSpace' results for two seconds, the engine queries it on every open.
CacheDiskFreeSpace = 1
; Essentials V2 gameplay redirect (enabled by default in this integration).
GameplayRedirect = 1
GameplayRedirectTrace = 0

[Loading]
; The game measures the CPU clock for one second on every video mode change, profile
; load and race start.
FastCpuSpeedCheck = 1

[HudScaling]
; Scales the race HUD and the in race menus with the screen height so they keep the
; size they had at 640x480. Elements stay anchored to the screen edges they belong to.
Enabled = 1
; Height the HUD was designed for, the HUD grows by screen height divided by this.
ReferenceHeight = 480
; Extra size factor, below 1 makes the HUD smaller, above 1 larger.
ScaleMultiplier = 1.0
; The HUD never gets smaller than its original pixel size.
MinimumScale = 1.0
; Scale the text with the rest of the HUD.
ScaleText = 1
; Speedometer or tachometer set to analog in 'Options -> Display' shows only the gauge,
; digital shows only the number. '0' keeps the game drawing the number in the gauge too
ExclusiveGaugeStyle = 1
; Fit the race loading screen to the screen height instead of a small 640x480 box.
ScaleLoadingScreen = 1
; Smooth the enlarged loading screen, '0' keeps hard pixel edges.
SmoothLoadingScreen = 1

[Text]
; Redraws the glyph sheets of every font at 2 or 4 times their resolution with smooth
; edges, so menu and HUD text stays crisp at high resolutions. Same typeface and layout.
Enabled = 1
; Enlargement factor: '0' picks 4 from 1440p up and 2 from 720p up, or set '2' or '4'.
Upscale = 0
; Edge sharpness of the enlarged glyphs, higher is crisper, lower is softer.
Sharpness = 0.5

[Detail]
Enabled = 1
; Multiplier on the track draw distance, on top of the View Distance option
; '1' keeps the original, '2' shows scenery and cars twice as far.
DrawDistanceScale = 2.0
; Draw distance in metres every spot of the track gets at least, '0' follows the track data.
; The track stores a distance per position that was kept short for the hardware of 2000,
; '2000' for example draws everything up to 2 km everywhere.
MinDrawDistance = 20000
; The 700 unit far clip plane follows the draw distance automatically, this adds more on top.
; The far clip is capped at 20000, beyond that the depth buffer loses too much precision.
FarClipMultiplier = 1.0
; Distant cars keep their wheels, the two farthest car models have none in the game data.
KeepDistantWheels = 1
; Cars close to the camera use the full detail model the garage shows.
; The game never drew the most detailed model in races, not even for the player car.
FullCarDetail = 1
; Texture quality, '0' lowest to '3' highest, '-1' keeps the game detection.
; Below '3' textures load in 16 bit and large ones at half size, decals and lettering on the
; cars get blurry. The detection rates every CPU above 2.1 GHz as a 1990s machine.
TextureDetail = 3
; Objects closer than this many metres are drawn even when the game hides them behind one of the
; occlusion walls of the track. The walls are tested in the top view without height, so from a
; slightly raised spot the game left holes in the ground close to the car. Further away the walls
; still hide track pieces whose surrounding ground is not drawn. '0' keeps the original test.
OcclusionRange = 220

[Dx11]
; Settings of the Direct3D 11 driver, used with 'ThrashDriver = dx11' option.
; Internal resolution, '0' renders at the size the picture covers on the display so the
; 640x480 menus and the garage get full display detail, '1' to '4' multiply the game resolution.
ResolutionScale = 0
; Multisample anti aliasing, '1' off, '2', '4' or '8' samples.
Antialiasing = 4
; Anisotropic texture filtering, '0' as the game asks, '2' to '16' forced on every filtered texture.
Anisotropy = 16
; Window mode, '0' borderless window over the whole monitor, '1' exclusive fullscreen at the
; desktop resolution, '2' resizable window.
WindowMode = 0
; Client size of the window in mode '2', '0' picks three quarters of the screen.
WindowWidth = 0
WindowHeight = 0
; Vertical sync, '1' on, '0' off. Off shows frames at once and tears where the display allows it.
VSync = 1
; '1' minimizes the borderless or fullscreen window when another program is activated with
; Alt+Tab and restores it on return, like the exclusive mode of the original driver.
MinimizeOnFocusLoss = 1
; Atmospheric fog, '1' on (default), '0' off. Only affects the DX11 renderer.
FogEnabled = 1
; Movies [needs 'Upscale' under '[Movie]']. '1' enlarges every movie frame once at the final
; resolution with a bicubic filter, '0' keeps the enlargement of the game.
MovieFilter = 1
; Edge sharpness of that filter, '0' to '100'. Low is soft, '33' is the Mitchell filter, '50' is
; Catmull Rom: crisper, with light halos at edges.
MovieSharpness = 33
; '1' lets a movie as wide as the screen fill the window. The black bars inside the frame are cut
; and the aspect ratio is kept, so a wide screen shows thin bars at most. '0' keeps the 4:3 picture.
MovieFill = 1
; Diagnostic call trace, number of lines written to 'dx11z.log', '0' is off.
Trace = 0

[Controller]
; Gamepads through SDL3.
Enabled = 1
; Leave DirectInput copies of pads SDL reads out of the controller list, so a pad is not
; listed twice. Wheels and other devices SDL does not treat as gamepads stay listed.
HideHandledDevices = 1
; Play the force feedback of the game as rumble, strength '0' to '2'.
Rumble = 1
RumbleStrength = 1.0
; Dead zones, '0' to '0.9'. Sticks use a round dead zone.
StickDeadzone = 0.10
TriggerDeadzone = 0.05
; Keep reading the pad while another program is in front.
BackgroundInput = 0
; Default modern bindings when the gamepad is picked as default controller: right trigger accelerate,
; left trigger brake, left stick steer, A hand brake, B camera, X look behind, Y reset car,
; right shoulder shift up, left shoulder shift down, Start pause. '0' keeps the joystick defaults.
TriggerBindings = 1

[Menu]
; Lists in the menus (cars, paints, tracks and others) scroll with the mouse wheel over the list and
; with the keys: up and down one row, page up and down one page, home and end to the start and end.
Scroll = 1
; Rows per notch of the mouse wheel, '1' to '20'.
WheelRows = 3
; Mouse wheel over a closed drop down list: down picks the next entry, up the previous one.
WheelSelect = 1

[Movie]
; Intro and menu movies. The movie player of the game enlarges every frame in software. With the DX11 driver
; the original sized frames go to the driver instead, see 'MovieFilter', 'MovieSharpness' and 'MovieFill'
; under '[Dx11]'. The stock driver does not take them, the game then scales as before.
Upscale = 1
